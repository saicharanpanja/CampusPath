[workspace]
members = [ "parser", "engine", "server", "frontend" ]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# Internal
parser = { path = "parser" }
engine = { path = "engine" }

# External
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }